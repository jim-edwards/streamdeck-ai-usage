# Keeps the SHA-pinned GitHub actions current (Dependabot updates the SHA and the version comment).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version, so update them in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
