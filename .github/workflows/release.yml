name: Release

# Push a tag like v1.2.3 to build and publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # Stream Deck's plugin runtime (manifest Nodejs.Version)
      - run: node --test

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload the asset
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build .streamDeckPlugin
        shell: pwsh
        run: ./scripts/pack.ps1 -Version $env:TAG

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.streamDeckPlugin \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
