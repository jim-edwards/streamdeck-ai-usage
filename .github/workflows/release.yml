name: Release

# Push a tag like v1.2.3 to build and publish a release:
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload the asset
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build .streamDeckPlugin
        shell: pwsh
        run: ./scripts/pack.ps1 -Version $env:TAG

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.streamDeckPlugin \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
